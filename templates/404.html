{% extends "base.html" %}

{% block title %}페이지를 찾을 수 없음 | Idea Developer{% endblock %}

{% block content %}
  <section class="mx-auto py-5 text-center" style="max-width: 620px" aria-labelledby="not-found-title">
    <div class="display-5 text-primary mb-3" aria-hidden="true"><i class="bi bi-signpost-split"></i></div>
    <p class="text-primary fw-semibold mb-2">404</p>
    <h1 id="not-found-title" class="h3 fw-bold mb-3">페이지를 찾을 수 없습니다.</h1>
    <p class="text-secondary mb-4">주소가 변경되었거나 접근할 수 없는 화면입니다. 홈에서 다시 시작해 주세요.</p>
    <div class="d-flex justify-content-center gap-2 flex-wrap">
      <a class="btn btn-primary" href="{% url 'ideas:home' %}"><i class="bi bi-house-door me-1"></i> 홈으로</a>
      <button class="btn btn-outline-secondary" type="button" onclick="history.back()"><i class="bi bi-arrow-left me-1"></i> 이전 화면</button>
    </div>
  </section>
{% endblock %}
